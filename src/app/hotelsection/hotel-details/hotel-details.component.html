<div class="cls-hotelMain">
    <app-header></app-header>
    <div class="cls-hotelHead">
        <div class="cls-sectorDetails">
            <h1>Hotel Selection</h1>
            <p>
                <span>{{requestFormValue.toCity.split(',')[0].trim()}}</span> •
                {{requestFormValue.totalDays}} Nights
            </p>
        </div>
    </div>
    <div class="cls-hotelBody" *ngIf="!loader">
        <div class="cls-filterContainer" *ngIf="filterBudgetRemove">
            <app-filter [filterValues]="filterData"(filterChange)="filterChanged($event)"></app-filter>
        </div>
        <div class="cls-cardContainer" [ngClass]="{'cls-noValuesFound': !filterBudgetRemove}">
            <app-hotel-body [hotelDetails]="filterHotelValues" ></app-hotel-body>
        </div>
        <div class="cls-budgetContainer" *ngIf="filterBudgetRemove">
            <app-hotel-budget-status [packageDetails]="requestFormValue" (hotelRemoved)="hotelRemovedFun($event)"></app-hotel-budget-status>
        </div>
    </div>
</div>
