<div class="cls-flight-main" >
    <app-header></app-header>
    <div class="cls-flight-details">
        <div class="cls-flightHead">
            <div class="cls-sector-details">
                <h1>Flight Selection</h1>
                <p>
                    <span>{{cityValue.fromCity}} -> {{cityValue.toCity}}</span> •
                    {{ tripType === 'roundTrip' ? 'Round Trip' : 'One Way' }}
                </p>
            </div>
        </div>
        <div class="cls-flight-body" *ngIf="!loader">
            <div class="cls-flight-container">
                <app-flight-filter [tripTypeValue]="tripType" [formData]="filterApplyData" [filterValues]="filterData"(filterChange)="filterChanged($event)"></app-flight-filter>
            </div>
            <div class="cls-flightCard-container">
                <div class="cls-sector-type">
                    <button [class.active]="tripType === 'oneWay'" (click)="changeTripType('oneWay')">
                        One Way
                    </button>
                    <button [class.active]="tripType === 'roundTrip'" (click)="changeTripType('roundTrip')">
                        Round Trip
                    </button>
                </div>
                <div class="cls-countSec">
                    <div class="cls-count">
                        <span>{{flightDetailsData?.length}} </span>
                        <span>flights found</span>
                    </div>
                    <div class="cls-sector">
                        <span>{{cityValue.fromCity}} -> {{cityValue.toCity}}</span>
                    </div>
                </div>
                <app-flight-card [tripTypeValue]="tripType" [flightDetails]="flightDetailsData" (selectFlightDetails)="selectFlightFun($event)"></app-flight-card>
            </div>
            <div class="cls-budget-container">
                <app-flight-budget-status [packageDetails]="formPackageDetails" [budgetValue]="budgetStatus" [selectedValues]="selectedFlights"></app-flight-budget-status>
            </div>
        </div>
    </div>
</div>
